services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - ./data/mailpit:/data
  python-api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AP_DATA_DIR: /data/ap
      # Gross EUR ceiling: amounts at or above this require human review.
      AP_AUTO_APPROVAL_LIMIT_EUR: "1500.00"
      AP_REVIEW_EVENT_URL: http://n8n:5678/webhook/ap-native-review-b2-v2
      AP_BATCH_EVENT_URL: http://n8n:5678/webhook/ap-native-excel-b2-v2
      AP_OUTCOME_AUTODISPATCH: "1"
      AP_REVIEW_EVENT_TOKEN: ${AP_REVIEW_EVENT_TOKEN:-}
      AP_PUBLIC_BASE_URL: ${AP_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      AP_LLM_BASE_URL: ${AP_LLM_BASE_URL:-}
      AP_LLM_MODEL: ${AP_LLM_MODEL:-}
      AP_LLM_API_KEY: ${AP_LLM_API_KEY:-}
      AP_LLM_MIN_INTERVAL_SECONDS: ${AP_LLM_MIN_INTERVAL_SECONDS:-0}
    volumes:
      - ./data/ap:/data/ap
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  n8n:
    image: n8nio/n8n:2.42.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXTERNAL_HOOK_FILES: /opt/ap-hooks/n8n_review_header_privacy.cjs
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts/n8n_review_header_privacy.cjs:/opt/ap-hooks/n8n_review_header_privacy.cjs:ro

volumes:
  n8n_data:
